<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <script>
    window.va = window.va || function () {
      (window.vaq = window.vaq || []).push(arguments);
    };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
  <title>Signal Lost | PalaRivals Watch</title>
  <link rel="stylesheet" href="/css/shared/Audio.css">
  <style>
    :root { color-scheme: dark; font-family: "Arial Narrow", Arial, sans-serif; }
    * { box-sizing: border-box; }
    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      place-items: center;
      color: #f7fbff;
      background:
        linear-gradient(rgba(95, 231, 255, .045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(95, 231, 255, .045) 1px, transparent 1px),
        radial-gradient(circle at 20% 80%, rgba(95, 231, 255, .14), transparent 35%),
        radial-gradient(circle at 82% 16%, rgba(255, 79, 113, .12), transparent 34%),
        #040914;
      background-size: 58px 58px, 58px 58px, auto, auto, auto;
    }
    main {
      width: min(100%, 680px);
      padding: clamp(34px, 8vw, 72px);
      border: 1px solid rgba(95, 231, 255, .25);
      text-align: center;
      background: linear-gradient(145deg, rgba(12, 28, 49, .96), rgba(6, 10, 23, .98));
      box-shadow: 0 34px 90px rgba(0, 0, 0, .55), inset 0 0 60px rgba(95, 231, 255, .025);
      clip-path: polygon(18px 0, 100% 0, 100% calc(100% - 18px), calc(100% - 18px) 100%, 0 100%, 0 18px);
    }
    small { color: #5fe7ff; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; }
    h1 { margin: 14px 0 8px; font-size: clamp(3.5rem, 14vw, 8rem); font-style: italic; line-height: .85; }
    p { margin: 0 auto 28px; color: #91a2b8; font-size: 1rem; }
    a {
      display: inline-flex;
      min-height: 48px;
      padding: 0 24px;
      border: 1px solid rgba(95, 231, 255, .48);
      align-items: center;
      color: #06111e;
      background: linear-gradient(100deg, #5fe7ff, #81cfff);
      font-weight: 900;
      letter-spacing: .1em;
      text-decoration: none;
      text-transform: uppercase;
      transition: filter 150ms ease, transform 150ms ease;
    }
    a:hover, a:focus-visible { filter: brightness(1.12); outline: none; transform: translateY(-3px); }
  </style>
</head>
<body data-audio-scene="menu">
  <main>
    <small>Navigation failure // 404</small>
    <h1>Signal Lost</h1>
    <p>This route is outside the combat network.</p>
    <a id="MainMenuReturn" href="Main.html">Return to Main Menu</a>
  </main>
  <script src="/js/shared/AudioManager.js"></script>
  <script>
    const mainMenuReturn = document.getElementById("MainMenuReturn");
    const isLocalPreview = location.protocol === "file:"
      || location.hostname === "localhost"
      || location.hostname === "127.0.0.1";

    if (!isLocalPreview) {
      mainMenuReturn.href = "/";
    }
  </script>
</body>
</html>
